name: Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/**'
      - '.github/workflows/deploy-infrastructure.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'infrastructure/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: 'dev'

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  deploy-infrastructure:
    name: Deploy CDK Infrastructure
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Python dependencies
        working-directory: infrastructure
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine environment
        id: determine-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Build frontend
        working-directory: frontend
        env:
          REACT_APP_WEATHERLINK_API_KEY: ${{ secrets.REACT_APP_WEATHERLINK_API_KEY }}
          REACT_APP_WEATHERLINK_API_SECRET: ${{ secrets.REACT_APP_WEATHERLINK_API_SECRET }}
          REACT_APP_WEATHERLINK_STATION_ID: ${{ secrets.REACT_APP_WEATHERLINK_STATION_ID }}
        run: |
          npm ci
          npm run build

      - name: CDK Synth
        working-directory: infrastructure
        run: |
          cdk synth --context environment=${{ steps.determine-env.outputs.environment }}

      - name: CDK Deploy
        working-directory: infrastructure
        run: |
          cdk deploy --all \
            --context environment=${{ steps.determine-env.outputs.environment }} \
            --require-approval never

      - name: Get outputs
        working-directory: infrastructure
        run: |
          cdk output --all --context environment=${{ steps.determine-env.outputs.environment }}
